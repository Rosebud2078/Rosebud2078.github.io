<style>

    .levelSelect,
    .levelSelect * {
		box-sizing:border-box;
    }

	.levelSelect {
        font-family: 'm5x7';
		background:black;
		color:white;
		width:100%;
		padding: 20px;
		margin:0 auto;
		display:flex;
		flex-direction:column;
		align-items:center;
		counter-reset: levelcount;
		position: fixed;
	    inset: 0;
	    z-index: 999;
	    overflow: hidden;
	    -webkit-font-smoothing: none;
	    min-height:100%;
	    font-size: 32px;

		--tile-size: calc(612px / 38);
	}

	.levelSelect.hidden {
		display:none !important;
	}

	.levelSelectCanvasWrap {
		width: 306px;
		max-width: 100%;
		background-image: url('images/level_bg3.png');
		background-size: calc(var(--tile-size) * 2) auto;
		margin-bottom: 30px;
		image-rendering: pixelated;
		position:relative;
	}

	.levelSelectCanvasWrap:before,
	.levelSelectCanvasWrap:after {
		position:absolute;
		top: 50%;
		margin-top:-0.5em;
		width: 0.8em;
		height: 0.8em;
		text-align:center;
		animation: arrowWiggle 500ms steps(1) 0s infinite;
		background:black;
		z-index:2;
	}

	.levelSelectCanvasWrap:before {
		content: '<';
		left: -1.5em;
		animation-delay: -250ms;
	}

	.levelSelectCanvasWrap:after {
		content: '>';
		right: -1.5em;
	}

	.levelSelect:has(.fromLeft) .levelSelectCanvasWrap:before {
		animation: arrowActive 100ms linear 0s 1 both, arrowWiggle 500ms steps(1) 250ms infinite;
	}

	.levelSelect:has(.fromRight) .levelSelectCanvasWrap:after {
		animation: arrowActive 100ms linear 0s 1 both, arrowWiggle 500ms steps(1) 0s infinite;
	}

	@keyframes arrowWiggle {
		0%, 100% { transform: translateX(-1px); }
		50% { transform: translateX(1px); }
	}

	@keyframes arrowActive {
		0%, 99.99% { background-color: white; color:black; }
		100% { background-color: black; color:white; }
	}


	.levelSelectCanvas {
		margin-left:-50%;
		margin-right:-50%;
		width:200%;
		height: auto;
		image-rendering: pixelated;
		filter: drop-shadow(calc(var(--tile-size) / 2) calc(var(--tile-size) / 2) 0 black);
		transition: transform 500ms ease;
		display:block;
	}

	.levelSelectCanvas.offsetX {
		transform: translateX( calc(var(--tile-size) / -2) );
	}

	.levelSelectCanvas.offsetY {
		transform: translateY( calc(var(--tile-size) / -2) );
	}

	.levelSelectCanvas.offsetX.offsetY {
		transform: translateX( calc(var(--tile-size) / -2) ) translateY( calc(var(--tile-size) / -2) );
	}

	.levelSelectText {
		width: 360px;
		max-width: 100%;
		text-align:center;
		position:relative;
	}

	.levelSelectText.fromLeft {
		animation: textFromLeft 300ms ease-out 0s 1 both;
	}

	.levelSelectText.fromRight {
		animation: textFromRight 300ms ease-out 0s 1 both;
	}

	@keyframes textFromLeft {
		from { transform: translateX(-50px); opacity:0; }
		to   { transform: translateX(0); opacity:1; }
	}

	@keyframes textFromRight {
		from { transform: translateX(50px); opacity:0; }
		to   { transform: translateX(0); opacity:1; }
	}

	.completeMark {
		content:'';
		position:absolute;
		right:-5px;
		bottom:-5px;
		width: 25px;
		height: 25px;
		background: url('images/complete.png') center no-repeat;
		background-size: 100%;
		box-shadow: 0 0 0 4px black;

		transition: all 200ms ease;
		visibility:hidden;
		transform: scale(0);
	}

	.complete .completeMark {
		visibility:visible;
		transform: scale(1);
	}

	.levelSelectText strong {
		font-weight:normal;
		display:block;
	}

	.levelSelectText span {
		font-weight:normal;
		display:block;
		color:#888;
		margin-top: 5px;
	}

	.levelSelectText span img {
		width: 30px;
		height: 30px;
		image-rendering: pixelated;
		display:inline-block;
		vertical-align: middle;
		margin-right: 10px;
	}

	.levelSelectText span a {
		text-decoration:none;
		box-shadow: 0 2px 0 0 currentColor;
		color:inherit;
	}

	.levelSelectText span a:hover {
		color:white;
	}

	.levelSelectProgress {
		display:flex;
		align-items:center;
		gap: 8px;
		margin-bottom:20px;
		background-image: linear-gradient(#333, #333);
		background-size: 100% 2px;
		background-position:center;
		background-repeat:no-repeat;
		height: 16px;
	}

	.levelSelectProgress > div {
		display:block;
		width:8px;
		aspect-ratio: 1 / 1;
		border: 2px solid #333;
		background:black;
		transition: all 100ms ease;
	}

	.levelSelectProgress > div.active{
		width: 16px;
		border: 2px solid white;
	}

	.levelSelectProgress > div.complete{
		background: #458919;
		border-color: #458919;
	}

	.levelSelectProgress > div.complete.active {
		border-color: white;
	}

	.levelSelectMobileControls {
		font-size: 24px;
		text-align:center;
		position:absolute;
		left:0;
		width:100%;
		bottom:0;
		padding:24px;
		opacity:0.3;
		display:none;
		pointer-events:none;
	}

	@media screen and (max-width: 640px){

		.levelSelectCanvasWrap:before {
			left: -1em;
		}

		.levelSelectCanvasWrap:after {
			right: -1em;
		}

		.levelSelectMobileControls {
			display:block;
		}
	}

</style>

<script>

    var imagesLoaded = 0;
    var imagesToLoad = 0;
    var levelSprites = {};

    function loadImage(name, url){
      var img = new Image();

      imagesToLoad++;

      img.onload = function(){
        imagesLoaded++;
        if(imagesLoaded == imagesToLoad) {
			levelSelectChange();
        }
      }

      img.src = url;

      levelSprites[name] = img;
    }

    loadImage("level1", "images/level1.png");
    loadImage("level2", "images/level2.png");
    loadImage("level3", "images/level3.png");
    loadImage("level4", "images/level4.png");
    loadImage("level5", "images/level5.png");
    loadImage("level6", "images/level6.png");
    loadImage("level7", "images/level7.png");
    loadImage("level8", "images/level8.png");
    loadImage("level9", "images/level9.png");
    loadImage("level10", "images/level10.png");
    loadImage("level11", "images/level11.png");
    loadImage("level12", "images/level12.png");
    loadImage("level13", "images/level13.png");
    loadImage("level14", "images/level14.png");
    loadImage("level15", "images/level15.png");
    loadImage("level16", "images/level16.png");
    loadImage("level17", "images/level17.png");
    loadImage("level18", "images/level18.png");
    loadImage("level19", "images/level19.png");

</script>

<script>

	var levelSelectActive = true;
	var levelSelectEl = document.querySelector('.levelSelect');
	var levelSelectText = document.querySelector('.levelSelectText');
	var levelSelectProgress = document.querySelector('.levelSelectProgress');
	var levelSelectCanvas = document.querySelector('.levelSelectCanvas');
	var levelSelectCtx = levelSelectCanvas.getContext("2d");
	var levelSelectTransition = 0;

	for(var i = 0; i<games.length; i++){
		levelSelectProgress.innerHTML += "<div></div>"
	}

	var currentGameIndex = 0;
	var gamesComplete = 0;

	// Overwrite DoWin to save progress for the level select
	var originalDoWin = DoWin;
	DoWin = function(){
		localStorage.setItem(`snake_complete_${currentGameIndex}`, 1);

		originalDoWin();
	}

	// Overwrite the checkKey function and cancel it when level select is active
	var originalCheckKey = checkKey;
	checkKey = function(e, justPressed){

		if(levelSelectActive) return;

		originalCheckKey(e, justPressed);

	}

	// Overwrite the storage_set function so save states aren't created
	storage_set = function(key, value) {
		return null;
	}

	// Show level select when escape is pressed
	goToTitleScreen = function(){
		textMode = true;
		titleScreen = true;
		generateTitleScreen();
		chainShowLevelSelect();
	}

	function chainShowLevelSelect(){

		levelSelectEl.classList.remove('hidden');
		levelSelectActive = true;

		levelSelectChange();

	}

	function chainLoadGame(index = null){

		if(index == null) index = currentGameIndex;

		if(index >= games.length){
			chainShowLevelSelect();
			return;
		}

		currentGameIndex = index;

		levelSelectEl.classList.add('hidden');

		var game = games[index];
		
		compile(["restart"],game.sourceCode);

		// After loading the new game, automatically begin the first level
		curlevel = 0;
		curlevelTarget = null;
		nextLevel();

	}

	chainShowLevelSelect();

	function levelSelectChange(offset = 0){

		currentGameIndex = currentGameIndex+offset;

		if(currentGameIndex < 0) {
			currentGameIndex = 0;
			return;
		}
		if(currentGameIndex > games.length-1) {
			currentGameIndex = games.length-1;
			return;
		}

		var game = games[currentGameIndex];

		//<img src="images/avatar_${currentGameIndex}.png">
		levelSelectText.innerHTML = `<strong>${game.title}</strong>`;

		if(game.author){
			if(game.homepage){
				levelSelectText.innerHTML += `<span> by <a target="_blank" href="${game.homepage}">${game.author}</a></span>`;
			}else{
				levelSelectText.innerHTML += `<span> by ${game.author}</span>`;
			}
		}


		var levelImg = levelSprites[`level${currentGameIndex+1}`];

		var oddTileWidth = Math.floor(levelImg.width/5) % 2;
		var oddTileHeight = Math.floor(levelImg.height/5) % 2;

		levelSelectCanvas.classList.toggle("offsetX", oddTileWidth);
		levelSelectCanvas.classList.toggle("offsetY", oddTileHeight);

		// Check completion
		var gameComplete = localStorage.getItem(`snake_complete_${currentGameIndex}`);

		levelSelectEl.classList.toggle('complete', gameComplete == 1);

		if(gameComplete){
			//gamesComplete += 1;
		}


		// Text animation
		levelSelectText.classList.remove('fromLeft');
		levelSelectText.classList.remove('fromRight');

		void levelSelectText.offsetWidth;

		if(offset > 0){
			levelSelectText.classList.add('fromRight');
		}

		if(offset < 0){
			levelSelectText.classList.add('fromLeft');
		}

		if(offset != 0){
			levelSelectTransition = 0;
		}else{
			levelSelectTransition = 60;
		}

		// Progress indicator

		var progressPips = levelSelectProgress.querySelectorAll("div");

		progressPips.forEach((el, index) => {
			el.classList.toggle('complete', localStorage.getItem(`snake_complete_${index}`));
			el.classList.toggle('active', index == currentGameIndex);
		});
	
	}

	function levelSelectLoop(){

		//levelSelectCtx.clearRect(0,0,levelSelectCanvasWidth,levelSelectCanvasHeight);

		if(!levelSelectActive) return;

		if(levelSelectTransition < 30){
			levelSelectTransition++;
		}

		var levelImg = levelSprites[`level${currentGameIndex+1}`];

		var canvasTileWidth = Math.round(levelSelectCanvas.width/5);
		var canvasTileHeight = Math.round(levelSelectCanvas.height/5);

		var levelTileWidth = Math.round(levelImg.width/5);
		var levelTileHeight = Math.round(levelImg.height/5);

		var tileOffsetx = Math.ceil((canvasTileWidth-levelTileWidth)/2);
		var tileOffsety = Math.ceil((canvasTileHeight-levelTileHeight)/2);

		for(var x = 0; x<canvasTileWidth; x++) {
		for(var y = 0; y<canvasTileHeight; y++) {

		if(Math.random() < levelSelectTransition/30){
			levelSelectCtx.clearRect(x*5, y*5, 5, 5);

			if(
				x >= tileOffsetx &&
				x < tileOffsetx+levelTileWidth &&
				y >= tileOffsety &&
				y < tileOffsety+levelTileHeight
			){
				levelSelectCtx.drawImage(levelImg, (x-tileOffsetx)*5, (y-tileOffsety)*5, 5, 5, x*5, y*5, 5, 5);
			}
		}



		}
		}


	}

	setInterval(levelSelectLoop, 30);

	function levelSelectInput(input){
		if(!levelSelectActive) return;

		if(input == "left"){
			levelSelectChange(-1);
		}

		if(input == "right"){
			levelSelectChange(1);
		}

		if(input == "select"){
			levelSelectActive = false;
			chainLoadGame();
		}
	}

	document.addEventListener('keydown', (e) => {

		if(levelSelectActive){
			if(e.code == "ArrowLeft" || e.code == "KeyA"){
				levelSelectInput("left");
			}

			if(e.code == "ArrowRight" || e.code == "KeyD"){
				levelSelectInput("right");
			}

			if(e.code == "Space" || e.code == "Enter" || e.code == "KeyX"){
				levelSelectInput("select");
				e.stopPropagation();
			}
		}

	}, true);

	// Touch Devices

    var swipeStartx = 0;
    var swipeStarty = 0;
    var swipeEndx = 0;
    var swipeEndy = 0;
    var swipeSize = 10*window.devicePixelRatio;
    var isSwiping = false;

    document.addEventListener('touchstart', function(e){

		if(levelSelectActive){
            swipeStartx = e.touches[0].pageX;
            swipeStarty = e.touches[0].pageY;
            swipeEndx = swipeStartx;
            swipeEndy = swipeStarty;
            isSwiping = true;
        }

    }, true);

    document.addEventListener('touchmove', function(e){
        swipeEndx = e.touches[0].pageX;
        swipeEndy = e.touches[0].pageY;
    }, true);

    function touchEndFn(e){

		if(levelSelectActive){
        	if(isSwiping){
				if(swipeEndx - swipeStartx < -swipeSize){
					levelSelectInput("left");
				}else if(swipeEndx - swipeStartx > swipeSize){
					levelSelectInput("right");
				}/*else if(swipeEndy - swipeStarty < -swipeSize){
					levelSelectInput("right");
				}else if(swipeEndy - swipeStarty > swipeSize){
					levelSelectInput("right");
				}*/else{

					if(swipeEndx > window.innerWidth-40){
						levelSelectInput("right");
					}else if(swipeEndx < 40){
						levelSelectInput("left");
					}else{

						var clickingLink = e.target.closest('a');

						if(!clickingLink){
							levelSelectInput("select");
							e.stopPropagation();
						}
						
					}

				}
			}
		}

		isSwiping = false;
    }

    document.addEventListener('touchend', touchEndFn, true);
    document.addEventListener('touchcancel', touchEndFn, true);


</script>
