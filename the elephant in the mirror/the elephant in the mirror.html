f7f #8f8f8f\ncopy: AmbiantOcclusionInnerCorner:up rot:up:>\n\nAmbiantOcclusionOutterCorner:up\n#7f7f7f #8f8f8f\n.............10\n.............11\n...............\n...............\n...............\n...............\n...............\n...............\n...............\n...............\n...............\n...............\n...............\n...............\n...............\n\nAmbiantOcclusionOutterCorner:directions\n#7f7f7f #8f8f8f\ncopy: AmbiantOcclusionOutterCorner:up rot:up:>\n\n\n\n\n================\nCOLLISIONLAYERS\n================\n\nBackground\ndirections -> AmbiantOcclusion:directions\ndirections -> AmbiantOcclusionInnerCorner:directions\ndirections -> AmbiantOcclusionOutterCorner:directions\nBrokenMirror1, BrokenMirror2\nTarget, PlaceToBeScared\n\nPeanut, Mirror, Sprite:Observer:directions, ScaredHero:directions Wall\n\nLooking:directions\ndirections -> SeenFrom:directions\ndirections -> MustLook:directions, CannotFace:directions, MustRunToward:directions\nScared\nRunning\nDoNotTrumpet\n\n======\nRULES\n======\n\n\n(The player faces the direction he's going toward)\n[ > Sprite:Hero:directions ] -> [ > Sprite:Hero:> ] again\n\n\n(=== GRAPHICAL DETAILS ===)\n[ no Wall | Wall ] -> [ AmbiantOcclusion:> | Wall ]\n[ AmbiantOcclusion:> AmbiantOcclusion:v ] -> [ AmbiantOcclusion:> AmbiantOcclusion:v AmbiantOcclusionInnerCorner:> ]\n[ AmbiantOcclusion:^ | no AmbiantOcclusion:^ no Wall ] -> [ AmbiantOcclusion:^ | AmbiantOcclusionOutterCorner:< ]\n\n\n(=== VISION ===)\n\n(== Compute the directions each observer can gaze to ==)\n\n(the player only looks in front of him)\n[ Sprite:Hero:> ] -> [ Sprite:Hero:> MustLook:> ]\n\n(elephants cannot look behind them, and they don't look on the sides when they are charging)\n[ Sprite:Elephant:> Running ] -> [ Sprite:Elephant:> Running MustLook:> ]\n[ Sprite:Elephant:> no Running ] -> [ Sprite:Elephant:> MustLook:> MustLook:^ MustLook:v ]\n\n(NPCs can look in all directions)\n[ Sprite:NPC:directions ] -> [ Sprite:NPC:directions MustLook:up MustLook:right MustLook:down MustLook:left ]\n\n\n(== Propagate rays and set reactions ==)\n\nstartloop\n\n(= select a random observer and direction and start a vision ray =)\nrandom [ Sprite:Observer:directions MustLook:> ] -> [ Sprite:Observer:directions Looking:> SeenFrom:< ]\n\n(= propagate vision rays =)\n[ Looking:> | ] -> [ Looking:> | SeenFrom:< ]\n[ SeenFrom:< no Opaque no Mirror | ] -> [ SeenFrom:< | SeenFrom:< ]\n+ [ SeenFrom:Reflected1 no Opaque Mirror1 | ] -> [ SeenFrom:Reflected1 Mirror1 | SeenFrom:< ]\n+ [ SeenFrom:Reflected2 no Opaque Mirror2 | ] -> [ SeenFrom:Reflected2 Mirror2 | SeenFrom:< ]\n\n(= react to seing something =)\n\n(Hero is scared by elephants)\n[ Looking:> Sprite:Hero:> ] [ Sprite:Elephant:directions SeenFrom:directions ] -> [ Looking:> Scared stationary ScaredHero:> ] [ Sprite:Elephant:directions SeenFrom:directions ]\n\n(NPCs cannot look to elephants)\n[ Looking:> Sprite:NPC:directions ] [ Sprite:Elephant:directions SeenFrom:directions ] -> [ Looking:> Sprite:NPC:directions CannotFace:> ] [ Sprite:Elephant:directions SeenFrom:directions ]\n\n(Elephants move toward peanuts)\n[ Looking:> Sprite:Elephant:directions ] [ Peanut SeenFrom:directions ] -> [ Looking:> Sprite:Elephant:directions MustRunToward:> ] [ Peanut SeenFrom:directions ]\n\n(= cleanup vision markers =)\n[ SeenFrom:directions ] -> [ ]\n[ Looking:directions ] -> [ ]\n\nendloop\n\n\n(== NPC BEHAVIOR ==)\n\n(NPCs who cannot find a cumfortable direction get scared)\n[ Sprite:NPC:directions CannotFace:up CannotFace:right CannotFace:down CannotFace:left ] -> [ Sprite:NPC:directions Scared ]\n\n(reorient NPCs by turning them)\n(otherwise they turn counterclockwise)\nstartloop\n(TODO: this does not work, but it should?\nrandom [ Sprite:NPC:> CannotFace:> ] -> [ Sprite:NPC:^ CannotFace:> ])\nrandom [ Sprite:Lady:> CannotFace:> ] -> [ Sprite:Lady:^ CannotFace:> ]\nrandom [ Sprite:Gentleman:> CannotFace:> ] -> [ Sprite:Gentleman:^ CannotFace:> ]\nendloop\n\n(cleanup NPC constraints)\n[ CannotFace:directions ] -> [ ]\n\n\n(== ELEPHANT BEHAVIOR ==)\n\n(elephants run toward peanuts)\nstartloop\nrandom [ stationary Sprite:Elephant:directions MustRunToward:> ] -> [ > Sprite:Elephant:> MustRunToward:> ]\n[ > Sprite:Elephant:> no Running no DoNotTrumpet ] -> sfx0\n[ > Sprite:Elephant:> MustRunToward:directions ] -> [ > Sprite:Elephant:> Running ] again\nendloop\n\n(cleanup Elephant constraints)\n[ MustRunToward:directions ] -> [ ]\n[ DoNotTrumpet ] -> [ ]\n\n(elephants eat peanuts)\n(Todo: should humans also eat peanuts?)\n[ > Sprite:Elephant:> Running | Peanut ] -> [ > Sprite:Elephant:> | ] (todo: peanut cracking sound)\n\n(elephants push mirrors or break them, and stop running)\n[ > Sprite:Elephant:> Running | Mirror | no Blocking ] -> [ > Sprite:Elephant:> | > Mirror DoNotTrumpet | ] again\n[ > Sprite:Elephant:> Running | stationary Mirror1 ] -> [ > Sprite:Elephant:> | BrokenMirror1 DoNotTrumpet ] again\n[ > Sprite:Elephant:> Running | stationary Mirror2 ] -> [ > Sprite:Elephant:> | BrokenMirror2 DoNotTrumpet ] again\n\n(elephants keep running until they eat something or have no reason to run)\n[ > Sprite:Elephant:> Running | ] -> [ > Sprite:Elephant:> | Running ] again\n[ stationary Sprite:Elephant:> Running ] -> [ Sprite:Elephant:> ] again\n\n\n(== HERO'S BEHAVIOR ==)\n\n(player pushes pushables, but turns the head clockwise when doing so.)\n[ > Sprite:Hero:> | Pushable no PlaceToBeScared ] -> [ > Sprite:Hero:v | > Pushable ] again\n[ > Sprite:Hero:> | Pushable PlaceToBeScared ] -> [ > Sprite:Hero:> | > Pushable PlaceToBeScared ] again\n\n\n==============\nWINCONDITIONS\n==============\n\nAll Sprite:Hero:directions on Target\nAll Scared on PlaceToBeScared\n\n=======\nLEGEND\n=======\n\n. = Background\n# = Wall\ni = Sprite:Hero:up\nj = Sprite:Hero:right\nk = Sprite:Hero:down\nl = Sprite:Hero:left\nE = Sprite:Elephant:up\nF = Sprite:Elephant:right\nG = Sprite:Elephant:down\nH = Sprite:Elephant:left\nM = Sprite:Gentleman:down\nN = Sprite:Gentleman:up\nO = Sprite:Gentleman:right\nZ = Sprite:Gentleman:left\nQ = Sprite:Lady:down\nR = Sprite:Lady:up\nS = Sprite:Lady:right\nT = Sprite:Lady:left\nP = Peanut\nd = Peanut and PlaceToBeScared\nx = Target\n/ = Mirror1\n\\ = Mirror2\n\n=======     \nLEVELS\n=======\n\nmessage I'm late to the open bar party! Quick, let's find a drink before there's nothing left!\n\n(The Elephant Accident)\n#########\n#mxmmqq##\n#......##\n#......h#\n#.d....##\n#r.nrnr##\n##.######\nj..######\n#########\n\nmessage That elephant almost killed me!\nmessage That was so scary! I can't help but replaying the scene again and again in my head...\nmessage I cannot sleep. I don't want to see any other elephant in my life, ever. And I need another drink.\n\n(More Walking)\n##########\n#q.p....p#\n#....n.n.#\n#.m.r..ep#\n#...r..###\n##.qm..x##\n##e...pn##\n####.#####\n#....#####\n#i########\n\nmessage Everybody here just thinks about drinking. Nobody even notices that peanuts are served with the drinks. All these peanuts... No wonder it attracts the feral elephants.\n\n(The Bait)\n##########\n##########\n##...p.z##\n##.pmr.x##\n##..r..z##\n##s...er##\n####.#####\n####i#####\n\n(Rows and Order)\n#######x#\n#gmqmqmg#\n#.......#\n#.q.n.q.#\n#.p.m.n.#\n#.n.r.m.#\n#.p...q.#\n#.r.n.r.#\n#.......h\n###i#####\n\n\n\nmessage Those peanuts-free events are the bests! I raise my glass to the allergics! At least, it should not attract the elephants. And yet, I feel observed from all directions by avid peanut eaters...\n(Clockwise is not Always Wise)\ng#g#g#g\n\\..x../\n#..m..#\n#.\\./.#\n#..r..#\n#.....#\n#i#####\n\n\nmessage The constant feeling of being observed makes me feel uncomfortable, and my hands are shacking. Let's hope I won't break some glass. They say it brings bad luck.\n\n(Bad Luck in the Rear-View Mirror)\n#############\n#./.....\\.###\n#....m....#x#\n#.p..r....#.#\nj..s......h\\#\n#.\\.nq....#.#\n#....n....#p#\n#....\\....###\n#############\n\n\n(Crunching Mirror, Hidden Peanut)\n###########\n#.........#\n#.........#\n#.........#\n#ot..\\....#\nx.o.\\p/...h\n#.........#\n#/........#\n#.q.......#\n#.rn......#\n#i#########\n\nmessage Avoiding the elephants is so exhausting... at least, the drinks make me feel better. When my thoughts bring back the vision of that elephant running toward me, I'm less scared.\n\nmessage Actually, it's kind of cute. With that sparkle in the eyes, we can see it really loves peanuts. And these big ears that balance as it runs... so cool!\n\nmessage Maybe I should accept my fear of elephants and learn to appreciate them.                            Or maybe I should drink less?\n\nmessage The end.                                                    [Actually, elephants don't like peanuts.]\n")
