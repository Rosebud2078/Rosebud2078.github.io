                            rule.discard = [object_name.toUpperCase(), existingname.toUpperCase()];
                        }

                        layersUsed_l[layerIndex] = object_name;

                        if (object) {
                            objectsPresent.ior(objectMask);
                            objectlayers_l.ishiftor(0x1f, 5 * layerIndex);
                        } else {
                            anyObjectsPresent.push(objectMask);
                        }

                        if (object_dir === 'stationary') {
                            movementsMissing.ishiftor(0x1f, 5 * layerIndex);
                        } else {
                            movementsPresent.ishiftor(dirMasks[object_dir], 5 * layerIndex);
                        }
                    }
                }

                if (rule.rhs.length > 0) {
                    var rhscell = cellrow_r[k];
                    var lhscell = cellrow_l[k];
                    if (rhscell[0] === '...' && lhscell[0] !== '...') {
                        logError("An ellipsis on the right must be matched by one in the corresponding place on the left.", rule.lineNumber);
                    }
                    for (var l = 0; l < rhscell.length; l += 2) {
                        var content = rhscell[l];
                        if (content === '...') {
                            if (rhscell.length !== 2) {
                                logError("You can't have anything in with an ellipsis. Sorry.", rule.lineNumber);
                            }
                        }
                    }
                }

                if (objectsPresent === ellipsisPattern) {
                    cellrow_l[k] = ellipsisPattern;
                    continue;
                } else {
                    cellrow_l[k] = new CellPattern([objectsPresent, objectsMissing, anyObjectsPresent, movementsPresent, movementsMissing, null]);
                }

                //if X no X, then cancel
                if (objectsPresent.anyBitsInCommon(objectsMissing)){
                    //if I'm about the remove the last representative of this line number, throw an error
                    var ln = rule.lineNumber;
                    if ( (i>0 && state.rules[i-1].lineNumber===ln) || ( (i+1<state.rules.length) && state.rules[i+1].lineNumber===ln)){
                        //all good
                    } else {
                        logError('This rule has some content of the form "X no X" which can never match and so the rule is getting removed during compilation.', rule.lineNumber);
                    }
                    state.rules.splice(i,1);
                    i--;
                    continue;
                }
                
                if (rule.rhs.length === 0) {
                    continue;
                }

                var cell_r = cellrow_r[k];
                var layersUsed_r = layerTemplate.concat([]);
                var layersUsedRand_r = layerTemplate.concat([]);

                var objectsClear = new BitVec(STRIDE_OBJ);
                var objectsSet = new BitVec(STRIDE_OBJ);
                var movementsClear = new BitVec(STRIDE_MOV);
                var movementsSet = new BitVec(STRIDE_MOV);

                var objectlayers_r = new BitVec(STRIDE_MOV);
                var randomMask_r = new BitVec(STRIDE_OBJ);
                var postMovementsLayerMask_r = new BitVec(STRIDE_MOV);
                var randomDirMask_r = new BitVec(STRIDE_MOV);

                var trackerTransfers = [];
                for (var l = 0; l < cell_r.length; l += 2) {
                    var object_dir = cell_r[l];
                    var object_name_parts = cell_r[l + 1].split('@');
                    var object_name = object_name_parts[0];

                    if (object_dir === '...') {
                        //logError("spooky ellipsis found! (should never hit this)");
                        break;
                    } else if (object_dir === 'random') {
                        if (object_name in state.objectMasks) {
                            var mask = state.objectMasks[object_name];
                            randomMask_r.ior(mask);
                            var values;
                            if (state.propertiesDict.hasOwnProperty(object_name)) {
                                values = state.propertiesDict[object_name];
                            } else {
                                values = [object_name];
                            }
                            for (var m = 0; m < values.length; m++) {
                                var subobject = values[m];
                                var layerIndex = state.objects[subobject].layer | 0;
                                var existingname = layersUsed_r[layerIndex];
                                if (existingname !== null) {
                                    var o1 = subobject.toUpperCase();
                                    var o2 = existingname.toUpperCase();
                                    if (o1 !== o2) {
                                        logWarning("This rule may try to spawn a " + o1 + " with random, but also requires a " + o2 + " be here, which is on the same layer - they shouldn't be able to coexist!", rule.lineNumber);
                                    }
                                }

                                layersUsedRand_r[layerIndex] = subobject;
                            }

                        } else {
                            logError('You want to spawn a random "' + object_name.toUpperCase() + '", but I don\'t know how to do that', rule.lineNumber);
                        }
                        continue;
                    }

                    var object = state.objects[object_name];
                    var objectMask = state.objectMasks[object_name];
                    if (object) {
                        var layerIndex = object.layer | 0;
                    } else {
                        var layerIndex = state.propertiesSingleLayer[object_name];
                    }


                    if (object_dir == 'no') {
                        objectsClear.ior(objectMask);
                    } else {
                        var existingname = layersUsed_r[layerIndex];
                        if (existingname === null) {
                            existingname = layersUsedRand_r[layerIndex];
                        }

                        if (existingname !== null) {
                            if (rule.hasOwnProperty('discard')) {

                            } else {
                                logError('Rule matches object types that can\'t overlap: "' + object_name.toUpperCase() + '" and "' + existingname.toUpperCase() + '".', rule.lineNumber);
                            }
                        }

                        layersUsed_r[layerIndex] = object_name;

                        if (object_dir.length > 0) {
                            // If object is moving on RHS of rule, add it to mover mask
                            if (object_dir !== 'stationary') {
                                state.moverMask.ior(objectMask);
                            }
                            postMovementsLayerMask_r.ishiftor(0x1f, 5 * layerIndex);
                        }

                        var layerMask = state.layerMasks[layerIndex];

                        if (object) {
                            objectsSet.ibitset(object.id);
                            objectsClear.ior(layerMask);
                            objectlayers_r.ishiftor(0x1f, 5 * layerIndex);
                        } else {
                            // shouldn't need to do anything here...
                        }
                        //possibility - if object not present on lhs in same position, clear movement
                        if (object_dir === 'stationary') {
                            movementsClear.ishiftor(0x1f, 5 * layerIndex);
                        }                
                        if (object_dir === 'randomdir') {
                            randomDirMask_r.ishiftor(dirMasks[object_dir], 5 * layerIndex);
                        } else {
                            movementsSet.ishiftor(dirMasks[object_dir], 5 * layerIndex);
                        };

                        if (object_name_parts.length > 1) {
                            var tracker_name = object_name_parts[1];
                            var trackerSource = trackerSources[tracker_name];

                            if (trackerSource == null) {
                                logError('Tracker @' + tracker_name + ' referred to on right side of rule has not been defined on the left side', rule.lineNumber);
                                continue;
                            }

                            trackerTransfers.push([object_name.includes('above'), trackerSource[0], trackerSource[1], trackerSource[2]]);
                        }
                    }
                }

                //I don't know why these two ifs here are needed.
                if (!(objectsPresent.bitsSetInArray(objectsSet.data))) {
                    objectsClear.ior(objectsPresent); // clear out old objects
                }
                if (!(movementsPresent.bitsSetInArray(movementsSet.data))) {
                    movementsClear.ior(movementsPresent); // ... and movements
                }

                /*
                for rules like this I want to clear movements on newly-spawned entities
                    [ >  Player | Crate ] -> [  >  Player | > Crate  ]
                    [ > Player | ] -> [ Crate | Player ]

                WITHOUT havin this rule remove movements
                    [ > Player | ] -> [ Crate | Player ]
                (bug #492)
                */
               
                for (var l = 0; l < layerCount; l++) {
                    if (layersUsed_l[l] !== null && layersUsed_r[l] === null) {
                        // a layer matched on the lhs, but not on the rhs
                        objectsClear.ior(state.layerMasks[l]);
                        postMovementsLayerMask_r.ishiftor(0x1f, 5 * l);
                    }
                }

                objectlayers_l.iclear(objectlayers_r);

                postMovementsLayerMask_r.ior(objectlayers_l);
                if (!objectsClear.iszero() || !objectsSet.iszero() || !movementsClear.iszero() || !movementsSet.iszero() || !postMovementsLayerMask_r.iszero() || !randomMask_r.iszero() || !randomDirMask_r.iszero()) {
                    // only set a replacement if something would change
                    cellrow_l[k].replacement = new CellReplacement([objectsClear, objectsSet, movementsClear, movementsSet, postMovementsLayerMask_r, randomMask_r, randomDirMask_r, trackerTransfers]);
                }
            }
        }
    }
}

function cellRowMasks(rule) {
    var ruleMasks = [];
    var lhs = rule[1];
    for (var i = 0; i < lhs.length; i++) {
        var cellRow = lhs[i];
        var rowMask = new BitVec(STRIDE_OBJ);
        for (var j = 0; j < cellRow.length; j++) {
            if (cellRow[j] === ellipsisPattern)
                continue;
            rowMask.ior(cellRow[j].objectsPresent);
        }
        ruleMasks.push(rowMask);
    }
    return ruleMasks;
}

function cellRowMasks_Movements(rule){
    var ruleMasks_mov = [];
    var lhs = rule[1];
    for (var i = 0; i < lhs.length; i++) {
        var cellRow = lhs[i];
        var rowMask = new BitVec(STRIDE_MOV);
        for (var j = 0; j < cellRow.length; j++) {
            if (cellRow[j] === ellipsisPattern)
                continue;
            rowMask.ior(cellRow[j].movementsPresent);
        }
        ruleMasks_mov.push(rowMask);
    }
    return ruleMasks_mov;
}

function collapseRules(groups) {
    for (var gn = 0; gn < groups.length; gn++) {
        var rules = groups[gn];
        for (var i = 0; i < rules.length; i++) {
            var oldrule = rules[i];
            var newrule = [0, [], oldrule.rhs.length > 0, oldrule.lineNumber /*ellipses,group number,rigid,commands,randomrule,[cellrowmasks]*/ ];
            var ellipses = [];
            for (var j = 0; j < oldrule.lhs.length; j++) {
                ellipses.push(false);
            }

            newrule[0] = dirMasks[oldrule.direction];
            for (var j = 0; j < oldrule.lhs.length; j++) {
                var cellrow_l = oldrule.lhs[j];
                for (var k = 0; k < cellrow_l.length; k++) {
                    if (cellrow_l[k] === ellipsisPattern) {
                        if (ellipses[j]) {
                            logError("You can't use two ellipses in a single cell match pattern.  If you really want to, please implement it yourself and send me a patch :) ", oldrule.lineNumber);
                        }
                        ellipses[j] = true;
                    }
                }
                newrule[1][j] = cellrow_l;
            }
            newrule.push(ellipses);
            newrule.push(oldrule.groupNumber);
            newrule.push(oldrule.rigid);
            newrule.push(oldrule.commands);
            newrule.push(oldrule.randomRule);
            newrule.push(cellRowMasks(newrule));
            newrule.push(cellRowMasks_Movements(newrule));
            newrule.push(oldrule.global);
            newrule.push(oldrule.init);
            newrule.push(oldrule.noagaincheck);
            newrule.push(oldrule.destroy);
            rules[i] = new Rule(newrule);
        }
    }
    matchCache = {}; // clear match cache so we don't slowly leak memory
}



function ruleGroupDiscardOverlappingTest(ruleGroup) {
    if (ruleGroup.length === 0)
        return;

    for (var i = 0; i < ruleGroup.length; i++) {
        var rule = ruleGroup[i];
        if (rule.hasOwnProperty('discard')) {
            ruleGroup.splice(i, 1);

            //if rule before isn't of same linenumber, and rule after isn't of same linenumber, 
            //then a rule has been totally erased and you should throw an error!
            if ( (i===0 || ruleGroup[i-1].lineNumber !==  rule.lineNumber ) 
                && (i<ruleGroup.length-1 && ruleGroup[i+1].lineNumber !==  rule.lineNumber) || ruleGroup.length===0) {
                var example = rule['discard'];
                
                logError(example[0] + ' and ' + example[1] + ' can never overlap, but this rule requires that to happen.', rule.lineNumber);
            }
            i--;
        }
    }
}

function arrangeRulesByGroupNumber(state) {
    var aggregates = {};
    var aggregates_late = {};
    for (var i = 0; i < state.rules.length; i++) {
        var rule = state.rules[i];
        var targetArray = aggregates;
        if (rule.late) {
            targetArray = aggregates_late;
        }

        if (targetArray[rule.groupNumber] == undefined) {
            targetArray[rule.groupNumber] = [];
        }
        targetArray[rule.groupNumber].push(rule);
    }

    var result = [];
    for (var groupNumber in aggregates) {
        if (aggregates.hasOwnProperty(groupNumber)) {
            var ruleGroup = aggregates[groupNumber];
            ruleGroupDiscardOverlappingTest(ruleGroup);
            if (ruleGroup.length > 0) {
                result.push(ruleGroup);
            }
        }
    }
    var result_late = [];
    for (var groupNumber in aggregates_late) {
        if (aggregates_late.hasOwnProperty(groupNumber)) {
            var ruleGroup = aggregates_late[groupNumber];
            ruleGroupDiscardOverlappingTest(ruleGroup);
            if (ruleGroup.length > 0) {
                result_late.push(ruleGroup);
            }
        }
    }
    state.rules = result;

    //check that there're no late movements with direction requirements on the lhs
    state.lateRules = result_late;
}

function generateRigidGroupList(state) {
    var rigidGroupIndex_to_GroupIndex = [];
    var groupIndex_to_RigidGroupIndex = [];
    var groupNumber_to_GroupIndex = [];
    var groupNumber_to_RigidGroupIndex = [];
    var rigidGroups = [];
    for (var i = 0; i < state.rules.length; i++) {
        var ruleset = state.rules[i];
        var rigidFound = false;
        for (var j = 0; j < ruleset.length; j++) {
            var rule = ruleset[j];
            if (rule.isRigid) {
                rigidFound = true;
            }
        }
        rigidGroups[i] = rigidFound;
        if (rigidFound) {
            var groupNumber = ruleset[0].groupNumber;
            groupNumber_to_GroupIndex[groupNumber] = i;
            var rigid_group_index = rigidGroupIndex_to_GroupIndex.length;
            groupIndex_to_RigidGroupIndex[i] = rigid_group_index;
            groupNumber_to_RigidGroupIndex[groupNumber] = rigid_group_index;
            rigidGroupIndex_to_GroupIndex.push(i);
        }
    }
    if (rigidGroupIndex_to_GroupIndex.length > 30) {
        logError("There can't be more than 30 rigid groups (rule groups containing rigid members).", rules[0][0][3]);
    }

    state.rigidGroups = rigidGroups;
    state.rigidGroupIndex_to_GroupIndex = rigidGroupIndex_to_GroupIndex;
    state.groupNumber_to_RigidGroupIndex = groupNumber_to_RigidGroupIndex;
    state.groupIndex_to_RigidGroupIndex = groupIndex_to_RigidGroupIndex;
}

function getMaskFromName(state, name) {
    var objectMask = new BitVec(STRIDE_OBJ);
    if (name in state.objects) {
        var o = state.objects[name];
        objectMask.ibitset(o.id);
    }

    if (name in state.aggregatesDict) {
        var objectnames = state.aggregatesDict[name];
        for (var i = 0; i < objectnames.length; i++) {
            var n = objectnames[i];
            var o = state.objects[n];
            objectMask.ibitset(o.id);
        }
    }

    if (name in state.propertiesDict) {
        var objectnames = state.propertiesDict[name];
        for (var i = 0; i < objectnames.length; i++) {
            var n = objectnames[i];
            var o = state.objects[n];
            objectMask.ibitset(o.id);
        }
    }

    if (name in state.synonymsDict) {
        var n = state.synonymsDict[name];
        var o = state.objects[n];
        objectMask.ibitset(o.id);
    }

    if (objectMask.iszero()) {
        logErrorNoLine("error, didn't find any object called player, either in the objects section, or the legends section. there must be a player!");
    }
    return objectMask;
}

function generateMasks(state) {
    state.playerMask = getMaskFromName(state, 'player');

    var layerMasks = [];
    var layerCount = state.collisionLayers.length;
    for (var layer = 0; layer < layerCount; layer++) {
        var layerMask = new BitVec(STRIDE_OBJ);
        for (var j = 0; j < state.objectCount; j++) {
            var n = state.idDict[j];
            var o = state.objects[n];
            if (o.layer == layer) {
                layerMask.ibitset(o.id);
            }
        }
        layerMasks.push(layerMask);
    }
    state.layerMasks = layerMasks;

    var objectMask = {};
    for (var n in state.objects) {
        if (state.objects.hasOwnProperty(n)) {
            var o = state.objects[n];
            objectMask[n] = new BitVec(STRIDE_OBJ);
            objectMask[n].ibitset(o.id);
        }
    }

    // Synonyms can depend on properties, and properties can depend on synonyms.
    // Process them in order by combining & sorting by linenumber.

    var synonyms_and_properties = state.legend_synonyms.concat(state.legend_properties);
    synonyms_and_properties.sort(function(a, b) {
        return a.lineNumber - b.lineNumber;
    });

    for (var i = 0; i < synonyms_and_properties.length; i++) {
        var synprop = synonyms_and_properties[i];
        if (synprop.length == 2) {
            // synonym (a = b)
            objectMask[synprop[0]] = objectMask[synprop[1]];
        } else {
            // property (a = b or c)
            var val = new BitVec(STRIDE_OBJ);
            for (var j = 1; j < synprop.length; j++) {
                var n = synprop[j];
                val.ior(objectMask[n]);
            }
            objectMask[synprop[0]] = val;
        }
    }

    //use \n as a delimeter for internal-only objects
    var all_obj = new BitVec(STRIDE_OBJ);
    all_obj.inot();
    objectMask["\nall\n"] = all_obj;

    state.objectMasks = objectMask;

    // Mask to represent all objects that move - used for tracking objects for localised reset
    state.moverMask = new BitVec(STRIDE_OBJ);
}

function checkObjectsAreLayered(state) {
    for (var n in state.objects) {
        if (state.objects.hasOwnProperty(n)) {
            var found = false;
            for (var i = 0; i < state.collisionLayers.length; i++) {
                var layer = state.collisionLayers[i];
                for (var j = 0; j < layer.length; j++) {
                    if (layer[j] === n) {
                        found = true;
                        break;
                    }
                }
                if (found) {
                    break;
                }
            }
            if (found === false) {
                var o = state.objects[n];
                logError('Object "' + n.toUpperCase() + '" has been defined, but not assigned to a layer.', o.lineNumber);
            }
        }
    }
}

function twiddleMetaData(state) {
    var newmetadata = {};
    for (var i = 0; i < state.metadata.length; i += 2) {
        var key = state.metadata[i];
        var val = state.metadata[i + 1];
        newmetadata[key] = val;
    }

    if (newmetadata.flickscreen !== undefined) {
        var val = newmetadata.flickscreen;
        var coords = val.split('x');
        var intcoords = [parseInt(coords[0]), parseInt(coords[1])];
        newmetadata.flickscreen = intcoords;
    }
    if (newmetadata.zoomscreen !== undefined) {
        var val = newmetadata.zoomscreen;
        var coords = val.split('x');
        var intcoords = [parseInt(coords[0]), parseInt(coords[1])];
        newmetadata.zoomscreen = intcoords;
    }

    state.metadata = newmetadata;
}

function processWinConditions(state) {
    // [-1/0/1 (no,some,all),ob1,ob2] (ob2 is background by default)
    var newconditions = [];
    for (var i = 0; i < state.winconditions.length; i++) {
        var wincondition = state.winconditions[i];
        if (wincondition.length == 0) {
            return;
        }
        var num = 0;
        switch (wincondition[0]) {
            case 'no':
                { num = -1; break; }
            case 'all':
                { num = 1; break; }
        }

        var lineNumber = wincondition[wincondition.length - 1];

        var n1 = wincondition[1];
        var n2;
        if (wincondition.length == 5) {
            n2 = wincondition[3];
        } else {
            n2 = '\nall\n';
        }

        var mask1 = 0;
        var mask2 = 0;
        if (n1 in state.objectMasks) {
            mask1 = state.objectMasks[n1];
        } else {
            logError('Unwelcome term "' + n1 + '" found in win condition. Win conditions objects have to be objects or properties (defined using "or", in terms of other properties)', lineNumber);
        }
        if (n2 in state.objectMasks) {
            mask2 = state.objectMasks[n2];
        } else {
            logError('Unwelcome term "' + n2 + '" found in win condition. Win conditions objects have to be objects or properties (defined using "or", in terms of other properties)', lineNumber);
        }
        var newcondition = [num, mask1, mask2, lineNumber];
        newconditions.push(newcondition);
    }
    state.winconditions = newconditions;
}

function printCellRow(cellRow) {
    var result = "[ ";
    for (var i = 0; i < cellRow.length; i++) {
        if (i > 0) {
            result += "| ";
        }
        var cell = cellRow[i];
        for (var j = 0; j < cell.length; j += 2) {
            var direction = cell[j];
            var object = cell[j + 1]
            if (direction === "...") {
                result += direction + " ";
            } else {
                result += direction + " " + object + " ";
            }
        }
    }
    result += "] ";
    return result;
}

function cacheRuleStringRep(rule) {
    var result = "(<a onclick=\"jumpToLine('" + rule.lineNumber.toString() + "');\"  href=\"javascript:void(0);\">" + rule.lineNumber + "</a>) " + rule.direction.toString().toUpperCase() + " ";
    if (rule.rigid) {
        result = "RIGID " + result + " ";
    }
    if (rule.global) {
        result = "GLOBAL " + result + " ";
    }
    if (rule.noagaincheck) {
        result = "NOAGAINCHECK " + result + " ";
    }
    if (rule.destroy) {
        result = "DESTROY " + result + " ";
    }
    if (rule.init) {
        result = "INIT " + result + " ";
    }
    if (rule.randomRule) {
        result = "RANDOM " + result + " ";
    }
    if (rule.late) {
        result = "LATE " + result + " ";
    }
    for (var i = 0; i < rule.lhs.length; i++) {
        var cellRow = rule.lhs[i];
        result = result + printCellRow(cellRow);
    }
    result = result + "-> ";
    for (var i = 0; i < rule.rhs.length; i++) {
        var cellRow = rule.rhs[i];
        result = result + printCellRow(cellRow);
    }
    for (var i = 0; i < rule.commands.length; i++) {
        var command = rule.commands[i];
        if (command.length === 1) {
            result = result + command[0].toString();
        } else {
            result = result + '(' + command[0].toString() + ", " + command[1].toString() + ') ';
        }
    }
    //print commands next
    rule.stringRep = result;
}

function cacheAllRuleNames(state) {

    for (var i = 0; i < state.rules.length; i++) {
        var rule = state.rules[i];
        cacheRuleStringRep(rule);
    }
}

function printRules(state) {
    var output = "";
    var loopIndex = 0;
    var loopEnd = -1;
    var discardcount = 0;
    for (var i = 0; i < state.rules.length; i++) {
        var rule = state.rules[i];
        if (loopIndex < state.loops.length) {
            if (state.loops[loopIndex][0] < rule.lineNumber) {
                output += "STARTLOOP<br>";
                loopIndex++;
                if (loopIndex < state.loops.length) { // don't die with mismatched loops
                    loopEnd = state.loops[loopIndex][0];
                    loopIndex++;
                }
            }
        }
        if (loopEnd !== -1 && loopEnd < rule.lineNumber) {
            output += "ENDLOOP<br>";
            loopEnd = -1;
        }
        if (rule.hasOwnProperty('discard')) {
            discardcount++;
        } else {
            output += rule.stringRep + "<br>";
        }
    }
    if (loopEnd !== -1) { // no more rules after loop end
        output += "ENDLOOP<br>";
    }
    output += "===========<br>";
    output = "<br>Rule Assembly : (" + (state.rules.length - discardcount) + " rules)<br>===========<br>" + output;
    consolePrint(output);
}

function removeDuplicateRules(state) {
    var record = {};
    var newrules = [];
    var lastgroupnumber = -1;
    for (var i = state.rules.length - 1; i >= 0; i--) {
        var r = state.rules[i];
        var groupnumber = r.groupNumber;
        if (groupnumber !== lastgroupnumber) {
            record = {};
        }
        var r_string = r.stringRep;
        if (record.hasOwnProperty(r_string)) {
            state.rules.splice(i, 1);
        } else {
            record[r_string] = true;
        }
        lastgroupnumber = groupnumber;
    }
}

function generateLoopPoints(state) {
    var loopPoint = {};
    var loopPointIndex = 0;
    var outside = true;
    var source = 0;

        }
        var lineNumber = sound[sound.length - 1];

        if (sound.length === 2) {
            logError('incorrect sound declaration.', lineNumber);
            continue;
        }

        if (soundEvents.indexOf(sound[0]) >= 0) {
            if (sound.length > 4) {
                logError("too much stuff to define a sound event.", lineNumber);
            }
            var seed = sound[1];
            if (validSeed(seed)) {
                if (sfx_Events[sound[0]] !== undefined) {
                    logWarning(sound[0].toUpperCase() + " already declared.", lineNumber);
                }
                sfx_Events[sound[0]] = sound[1];
            } else {
                logError("Expecting sfx data, instead found \"" + sound[1] + "\".", lineNumber);
            }
        } else {
            var target = sound[0].trim();
            var verb = sound[1].trim();
            var directions = sound.slice(2, sound.length - 2);
            if (directions.length > 0 && (verb !== 'move' && verb !== 'cantmove')) {
                logError('incorrect sound declaration.', lineNumber);
            }

            if (verb === 'action') {
                verb = 'move';
                directions = ['___action____'];

            if (directions.length == 0) {

            }
            var seed = sound[sound.length - 2];

            for (var j = 0; j < directions.length; j++) {
                directions[j] = directions[j].trim();
                var direction = directions[j];
                if (soundDirectionIndicators.indexOf(direction) === -1) {

function formatHomePage(state) {
    if ('background_color' in state.metadata) {
        state.bgcolor = colorToHex(colorPalette, state.metadata.background_color);
    } else {
        state.bgcolor = "#000000";
    }
    if ('text_color' in state.metadata) {
        state.fgcolor = colorToHex(colorPalette, state.metadata.text_color);
    } else {
        state.fgcolor = "#FFFFFF";
    }

    if (isColor(state.fgcolor) === false) {
        logError("text_color in incorrect format - found " + state.fgcolor + ", but I expect a color name (like 'pink') or hex-formatted color (like '#1412FA').  Defaulting to white.")
        state.fgcolor = "#FFFFFF";
    }
    if (isColor(state.bgcolor) === false) {
        logError("background_color in incorrect format - found " + state.bgcolor + ", but I expect a color name (like 'pink') or hex-formatted color (like '#1412FA').  Defaulting to black.")
        state.bgcolor = "#000000";
    }

    if (canSetHTMLColors) {

        if ('background_color' in state.metadata) {
            document.body.style.backgroundColor = state.bgcolor;
        }

        if ('text_color' in state.metadata) {
            var separator = document.getElementById("separator");
            if (separator != null) {
                separator.style.color = state.fgcolor;
            }

            var h1Elements = document.getElementsByTagName("a");
            for (var i = 0; i < h1Elements.length; i++) {
                h1Elements[i].style.color = state.fgcolor;
            }

            var h1Elements = document.getElementsByTagName("h1");
            for (var i = 0; i < h1Elements.length; i++) {
                h1Elements[i].style.color = state.fgcolor;
            }
        }
    }

    if ('homepage' in state.metadata) {
        var url = state.metadata['homepage'];
        url = url.replace("http://", "");
        url = url.replace("https://", "");
        state.metadata['homepage'] = url;
    }
}

var MAX_ERRORS = 5;

function loadFile(str) {
    var processor = new codeMirrorFn();
    var state = processor.startState();

    var lines = str.split('\n');
    for (var i = 0; i < lines.length; i++) {
        var line = lines[i];
        state.lineNumber = i + 1;
        var ss = new CodeMirror.StringStream(line, 4);
        do {
            processor.token(ss, state);

            if (errorCount > MAX_ERRORS) {
                consolePrint("too many errors, aborting compilation");
                return;
            }
        }
        while (ss.eol() === false);
    }

    // delete state.lineNumber;

    generateExtraMembers(state);
    generateMasks(state);
    levelsToArray(state);
    rulesToArray(state);
    if (state.invalid>0){
        return null;
    }

    cacheAllRuleNames(state);

    removeDuplicateRules(state);

    if (state.invalid>0){
        return null;
    }

    rulesToMask(state);

    if (debugMode) {
        printRules(state);
    }

    arrangeRulesByGroupNumber(state);
    collapseRules(state.rules);
    collapseRules(state.lateRules);

    generateRigidGroupList(state);

    processWinConditions(state);
    checkObjectsAreLayered(state);

    twiddleMetaData(state);

    generateLoopPoints(state);

    generateSoundData(state);

    formatHomePage(state);

    delete state.commentLevel;
    delete state.names;
    delete state.abbrevNames;
    delete state.objects_candname;
    delete state.objects_section;
    delete state.objects_spritematrix;
    delete state.section;
    delete state.subsection;
    delete state.tokenIndex;
    delete state.visitedSections;
    delete state.loops;
    /*
    var lines = stripComments(str);
    window.console.log(lines);
    var sections = generateSections(lines);
    window.console.log(sections);
    var sss = generateSemiStructuredSections(sections);*/
    return state;
}

function compile(command, text, randomseed) {
    matchCache = {};
    forceRegenImages = true;
    if (command === undefined) {
        command = ["restart"];
    }
    if (randomseed === undefined) {
        randomseed = null;
    }
    lastDownTarget = canvas;

    if (text === undefined) {
        var code = window.form1.code;

        var editor = code.editorreference;

        text = editor.getValue() + "\n";
    }
    if (canDump === true) {
        compiledText = text;
    }

    errorCount = 0;
    compiling = true;
    errorStrings = [];
    consolePrint('=================================');
    try {
        var state = loadFile(text);
        //  consolePrint(JSON.stringify(state));
    } finally {
        compiling = false;
    }

    if (state && state.levels && state.levels.length === 0) {
        logError('No levels found.  Add some levels!', undefined, true);
    }

    if (errorCount > MAX_ERRORS) {
        return;
    }
    /*catch(err)
    {
     if (anyErrors===false) {
      logErrorNoLine(err.toString());
     }
    }*/

    if (errorCount > 0) {
        if (IDE===false){
            consoleError('<span class="systemMessage">Errors detected during compilation; the game may not work correctly.  If this is an older game, and you think it just broke because of recent changes in the puzzlescript engine, please consider dropping an email to analytic@gmail.com with a link to the game and I\'ll try make sure it\'s back working ASAP.</span>');
        } else{
            consoleError('<span class="systemMessage">Errors detected during compilation; the game may not work correctly.</span>');
        }
    } else {
        var ruleCount = 0;
        for (var i = 0; i < state.rules.length; i++) {
            ruleCount += state.rules[i].length;
        }
        for (var i = 0; i < state.lateRules.length; i++) {
            ruleCount += state.lateRules[i].length;
        }
        if (command[0] == "restart") {
            consolePrint('<span class="systemMessage">Successful Compilation, generated ' + ruleCount + ' instructions.</span>');
        } else {
            consolePrint('<span class="systemMessage">Successful live recompilation, generated ' + ruleCount + ' instructions.</span>');

        }


        
        if (IDE){
            if (state.metadata.title!==undefined) {
                document.title="PuzzleScript - " + state.metadata.title;
            }
        }
    }

    if (state!==null){//otherwise error
        setGameState(state, command, randomseed);
    }

    clearInputHistory();

    consoleCacheDump();

}

function Animatable(key, increment, update) {

    handles = {

            Animator.getInstance().animate(key, tickUp);
        },
        animateDown: function () {
            Animator.getInstance().animate(key, tickDown);
        }
    };

    ratio = 0;

    function tickUp () {
        var isFinished;

        }

imple tutorial level\n12. CHz: just added a level\n13. Pedro PSI: introduced the \"belt fusion\" mechanic, along with a level that requires it.\n14. Clickmazes: Added a level. Remodelled the red button. Darkened the wall to improve visibility of the ladders and red-wire. Added some provisional opening narrative and a proposal for a new player sprite (see under FEATURES). All changes very open for further iteration.\n15. ClementSparrow: introduced the \"inflatable\" walls and made a level for it and unit tests. Added graphical details (orange danger stripes, shadows, continuous wires) and changed the textures of background, platforms, doors, and walls. Added bugs #4 and #5\n16. Jumble: Added another starter level because I somehow managed to trip myself up on the first levels and I want to make sure nobody has to repeat my mistake\n17. Zomulgustar:  Added hub level\n18. Joseph Mansfield (sftrabbit): Me again! I jumped in here to finish off implementing Pedro PSI's mechanic, partly because I had encouraged the idea and partly because I knew it'd be very complicated to expect someone to implement as their contribution. So, we now have (A) belt fusion on the lower floor using clementsparrow's inflatable walls, and (B) belt fusion that is able to create diagonal belts and those diagonal belts can move objects diagonally... it's horrendously complicated so the rules are definitely more brittle but at least we're getting towards the end of the project so it shouldn't matter too much. There's probably some weird edge cases too. Let me know if you need anything fixed for a puzzle.\n19. Auroriax: Added a level!\n20. Deusovi: Added level focused around accidental discovery of belt fusion.\n21. Harry Damm: Applied Joseph's bug fix to Pedro PSI's mechanic.\n22. Crychair (Evan Malmud): Added a level that requires the player to setup all pieces before pressing the inflatable button. Wanted to show the pushing mechanism WITHOUT combining blocks. Also updated the look of the XBelt/Block(no push) to not have inverted colors compared to the other belts.\n\n\n(DEV LOG GROUP B)\n\n(#0 Joseph Mansfield (sftrabbit): Created the game seed! Conveyor belt blocks can be pushed around, climb up ladders to get on top of conveyor belts. Conveyor belts can also be pushed on top of conveyor belts.)\n(#1 That Scar: Made belts carry attached ladders and belts that sit on top of them. Also a level with hints at a connection idea.\nRenamed LadderU to LadderUpleaseReadTheGuidelines as a warning to myself and others; not sure if it's helpful because you kind of forget when making levels anyways :/\n)\n(#2 Joel: Added bombs, which blow stuff up in extremely subtle ways. Graphics are placeholder, and I didn't animate explosions.\nMade a level that probably shouldn't be the first bomb level.\nRenamed LadderUpleaseReadTheGuidelines to LadderU for obvious reasons.)\n(#3 Pichusuperlover: Everyone before me added mechanics so there is no way I could do that, instead I used some unused default mechanics in my level. No other major changes, just a bit of formatting. Pretty happy with it.)\n(#4 Notan: Made a level using bombs. Fixed bug #1-3. I'm not sure if the behaviour of bug #3 is actually more intuitive for players than the fixed version, so I left the Joel's original code in commented-out sections.)\n(#5 Guilherme Tows (zaratustra): Added a tile with only a wall on upper floor, and a level to demo it.)\n(#6 Patrick: Added starting level)\n(#7 Justas: Filed bug #5. Added a level. Changed the 'End' sprite. Added a hole to the Belt sprites)\n(#8 Blookerstein: Added a simple tutorial level.)\n(#9 Muftwin: Found and fixed an error in pichus level. Found a bug in Justas level. Made my own level thats pretty open to be made harder by any connections)\n(#10 Colin: Filed bugs #6-8. Bug #6 fixed and bugs 7 & 8 can be easily avoided since it's the edge of the level that causes them. Made a small level using aboveWalls.) \n(#11 Dan Williams (@videospacegames): added a level with ladders, overhead blocks, and conveyors)\n(#12 winterbeak: Added a level)\n(#13 Toombler: Moved Colin's level. Added a level that introduces bombs.)\n(#14 Zach: Added a level designed to enable alternate solutions in other levels)\n(#15 Joseph Mansfield (sftrabbit): Me again! Added a mechanic (and one simple puzzle) that \"explains\" the stickiness of the blocks. There are practical reasons for doing this for when I get to the phase where I join everything together into one world. Would love to see some puzzles with this mechanic. Note that now green blocks are sticky, and blue are not. Also changed detonation distance back to 2D manhattan distance because I think it'll be easier to visualise.)\n(#16 Shark: Graphical overhaul, added a level involving a slime vat.)\n\n\n(DEV LOG GROUP MERGE)\n\n#1: domcamus: Added a level exploring interactions between bombs, inflatables and doors.\n#2: jackk: added another level using bombs with inflatables\n#3: stevenjmiller: Tested interactions and added a level (plus a bonus one).\n#4: Ethan Clark: Added a level, fixed a bug. (Also, added a symbol or two to the LEGEND to allow for certain combinations of objects that were impossible before)\n#5: Jack Lance: Changed title, and added a level.\n#6: D5R: Added a level which contains a litte bit of everything. Also added functionality for slime vats to stickify objects on the top floor as well.\n#6B: D5R: Edited the level to something slightly different but still contains a litte bit of everything. \nAlso reverted the functionality for slime vats to the original and added a quick and dirty functionality which prevents laddered blocks\nfrom getting lifted by the doors (See Bug #9 on Group B for more info).\n\n\n## BUGS / FEATURES (GROUP A)\n\n\nIf you encounted any bugs, list them here. If you do fix a bug, mark it as fixed and add a unit test level to the bottom if you can. Ideally, we shouldn't have any levels that depend on bugs, but if fixing a bug means breaking a level, don't fix it (or speak to the person who created that level).\n\n0. Example bug: Doing the thingy breaks the thingy\n1. Failing to climb a ladder (because there's a dynamic block blocking you on the upper floor) still plays a \"you moved upstairs\" sound effect. probably best to not fix this until wayyy later b/c it'll make the code harder to read/modify\n2. I think I've noticed a bug when you get pushed into a wall by a belt on a belt. It seems the only direction you can move in then is towards the crate (which immediately pushes you back). This should probably be resolved either by killing the player or letting them move away, but it's not relevant to my level so I'll leave this for someone else. Example level:\n\n   #####\n   #saa#\n   #ddM#\n   ###:#\n   #####\n\n3 (fixed). Anything on top of a something that gets lifted by a door was being destroyed. Doors now won't lift if they have two things on them.\n\n4 the fusion of boxes is inconsistent. Currently, two Belt{Y} for some direction Y are fused to make a Belt{Y}, and belts with oposite directions are fused to make a BeltX, but belts with orthogonal directions are not fused, as can be seen in this example leading to an infinite loop:\n\n###\n#.#\n#ǩ#\n#s#\n#ł#\n#w#\n#;#\n\nI (ClementSparrow) suggest that all belts should fuse into a BeltX whatever their direction. It would change the current behavior of fusing belts with the same direction but this feature is currently used by no level as far as I can tell, and its usefulness seem dubious: If you need the fused belt and already have two of them, why would you do the fusion? So the feature seem only useful for levels where you actually need to avoid the fusion, in which case it does not really matter if the result of the fusion is a BeltX or a directional belt. Of course there could be more subtle designs that legitimate the current feature, but we also need to think about how the player could discover this feature and make sense of it.\n\n\n5 Player can sometime appear in inflated walls, either temporarily during the turn, or even at the end of the turn. Example:\n\n####ccc\n####c#c\n###+rr+\n#+r..##\n##e+###\n##;####\n\n\n(BUGS / FEATURES) (GROUP B)\n(If you encounted any bugs, list them here. If you do fix a bug, mark it as fixed and add a unit test level to the bottom if you can. Ideally, we shouldn't have any levels that depend on bugs, but if fixing a bug means breaking a level, don't fix it (or speak to the person who created that level).)\n(#1 bug (FIXED): When you push stacked objects but the upstairs object is also pushed by other upstairs objects, the first force is ignored.)\n(#2 bug (FIXED): When an upstairs object is pushed by a belt below it but it's also pushed by other upstairs objects, the first force is ignored.)\n(#3 bug (FIXED, but can be restored): The detonation range uses a manhattan distance in 2D space, while the explosion range uses a manhattan distance in 3D space. i.e. for the detonation range, the distance between two points (0, 0, above) and (2, 1, below) is counted as 3, not 4.)\n(#4 bug / feature (FIXED): When the lower part of stacked objects with a ladder is exploded, the ladder stays there and gets attached to the remaining part.)\n(#5 bug (NOT A BUG, Player is squashed): Pushing 2 blue crates stacked on top of each other into a Wall_above object causes the player to disappear: https://i.imgur.com/m2MNdSA.gif)\n(#6 bug (fixed): Climbing a ladder underneath a wallAbove deletes the wallAbove.)\n(#7 bug (avoidable): Pushing a chain of dynamic objects with a ladder towards the edge of level doesn't move the blocks but moves the ladder. Can be avoided if walls surround the level.)\n(#8 bug (avoidable): Pushing a block with a west ladder into the west edge doesn't move the ladder, which can reattach to another block afterwards. See unit test below. Can be avoided if walls surround the level.)\n(#9 bug (FIXED, kinda): Elevating a block with a ladder attached to it converts it back to a regular block (currently possible on @D5R's level but not part of the solution))\n(NOTE on bug #9: added a quick and dirty fix which makes it so that a laddered block on a lifter will just not lift at all when the button is pressed. Please note that this functionality only works properly on @D5R's level and not all possible block-ladder combinations have been taken into consideration or tested. Check line 3246 for the fix.)\n(#X Example bug: Doing the thingy breaks the thingy)\n\n\n\n## IDEAS / COMMENTS (GROUP A)\n\n\nJoseph Mansfield (sftrabbit) - some thoughts I've had:\n* There's totally room for a little intro section of very basic stuff leading into my seed level. In particular, could introduce the ladders and belt multi-pushing behaviour with only BeltXs.\n* I feel like mechanics that make interesting conveyor contraptions would be interesting.\n* Right now, I don't think there is any way to cause two chain reactions at the same time. A mechanic that allowed this could result in some interesting things happening (like belts landing on the player's head). Although this would also have some ambiguities to resolve (e.g. two blocks moving into same space at the same time, or what if player with block on head climbs ladder).\n* Can an infinite loop somehow be made into a useful thing? (I guess only if it can get interrupted by something)\n\nCorey Hardt -\n* Added the first potential title, mostly think it's funny, OK if it doesn't stick. Dispatch here refers to sending things along the conveyor belts, maybe theme is we're in a big interconnected factory/warehouse? \n\npancelor -\n* note that wires can go over walls! so you can leave trailing wires out to other people's puzzles and make a note in your level's CONNECT section.\n* I'm imagining a secret room with 5 wires coming in, and if all 5 are active, a bridge of 3 doors is extended that lets you go to the secret zone! and possibly each wire also has a one-way path leading back out to the puzzle where the bonus wire came from, so you can easily walk back and try to solve it in the alternate way\n* the implementation of active wires (vWire_On) can maybe be more performant by pre-calculating all connections to ConnectsToWires objects, instead of re-calculating them every step. I'm not gonna optimize it now and make the code harder to modify, but it's something to maybe look into if we run into performance issues later\n\nknexator -\n* it is possible with the initial mechanics to be crushed by a conveyor belt: get one top of another (against a wall, so the top one doesn't move) and push the bottom one.\n* I like the idea of a conveyor belt factory that uses its own conveyor belts as soon as they are produced\n\nMartin Ender (Menderbug) -\n* Updated the conveyor sprites to be more readable when many of them are together. Doesn't have to be final.\n* The wires and doors are really cool, but I wanted to explore conveyors a little further.\n* Since knexator noticed that it's possible to die, I added a sound effect, but anyone feel free to change the actual sound if you find a better one.\n* read this AFTER beating my level (because spoilers): I think we can do a lot with the idea of pushing bottom-layer belts that have top-layer belts on them, to create weirdly shifting rafts that carry other belts to their destination. Pretty sure my level is only the tip of the iceberg of this specific interaction.\n* Joseph's assumption that the current rules don't allow for simultaneous chain reactions are actually wrong. You can set this up by putting belts on top of other belts and pushing the bottom layer. Example:\n\n  ########\n  ###d~a##\n  #;wĽwŁ.#\n  ########\n\n  The current behaviour is that the two belts get pushed sequentially, so for this particular setup you end up with an infinite loop. It would probably good for some future participant to resolve this somehow.\n\nNorgg -\n* Found another situation where you could die if you stand on top of a belt which is on a door that activates, this was also destroying the top crates if two crates were on a door, have changed it so that doors won't lift up if there's two things on them\n* Made a level using stacking multiple blocks on a door to push one back the other way\n* Put a border around stationary belts\n* Gave the player a hard hat for safety\n\nLe Slo -\n*Wow, really cool so far, enjoying this a lot\n*I think blocks taken from other levels can sometimes be used just to access \"secrets\" and not just to add a whole layer to the puzzle (which is very cool too, but probably much harder than bring-a-block-out level design type), so we could leave those secret spaces to discover the narrative, nonexistent for now (Sorry, future participants).\n\nPedro PSI - extra thoughts:\n* Currently, stray ladders are buggy, as they can be crossed first... and then used to climb a block... Example:\n\n###\n#.#\n#8#\n#x#\n#.#\n#:#\n\n* I really liked the idea of chain reactions, so added a mechanic to combine two blocks arriving into an empty square at the same time. This resolves the loop in Menderbug's example.\n* It would be great to see the \"belt fusion\" mechanic extended. Some ideas: it could produce \"diagonal belts\" (U+R=UR) or be modified to generate two-step jump belts (l+L=LL).\n\nClickmazes - \n* the wall was previously \"#222222 brown\" but I found this confusing when there were lots of ladders. Also a red wire passing through a wall was almost invisible (to me). Can anyone propose a better color scheme?\n* I had a idea that the player-sprite might look more consistent if it was a bird-eye view. I mocked up a sprite that looks vaguely like a small robot on wheels. I leave it for a future contributor to consider if this (or something similar) is worth further development. There is also some extra opening narrative (commented out) that could be used if the sprite was ultimately a robot (in any perspective). No problem if the whole idea is shelved/deleted.\n\nRobot_Player_Above \n#00cc00 #009900 #808080 #606060\n22.22\n31113\n.100.\n31113\n22.22\nRobot_Player_Below \n#00b300 #008000 #707070 #505050\n[ditto]\n\nClementSparrow -\nVery cool puzzles so far.\n* I have tried to improve the readability of the levels, because without the pseudo-3D rendering promised by Joseph, I often mistake a Belt_Below for a Belt_Above and reciproquely. I tried to add graphical details that would help figure that out, but it also increased the visual noise, so I tried to remove some visual noise elsewhere too (e.g., in the walls). Feel free to change all that, especially the colors.\n* I thought the fusion mechanism was underused (only one level so far), and that it might be because the setup to cause a fusion is a little bit complex. Because of this complexity, I also thought it was a little bit unfair to ask the player to think about this possibility without prior introduction. So I added an \"inflatable walls\" mechanic to create more ways to push belts against each other. (And it would also be a good reason to use buttons that control multiple things, as this feature too is currently only used in one puzzle.)\n* Unfortunately, adding this mechanic created a lot of bugs and edge cases (some of which may still be unfixed) and in the end I worked too hard on it to also add the fusion of boxes at ground level. The feature should however be easy to add following Pedro PSI's method.\n* I see these \"inflatable walls\" as an extension of the \"doors\" mechanic: the doors are in the ground and extend upward, the inflatable walls are in the walls and extend horizontally in all directions. We might want to use similar representations for both if needed (I just use the same colors).\n* Inflatable walls allow to reuse the tricks already used with doors, but horizontally. As players can walk on them, it also allows to make bridges between platforms.\n* The inflatable walls mechanic could be made more specific, to have walls that extend only in some directions, or it could be extended to allow inflatable platforms (would they also extend upward and behave like a wall?) or even inflatable BeltX (but then, how do you wire them?).\n* This is a very basic implementation and a lot of edge cases exist, so use the feature wisely and improve the implementation if you need it.\n* Inflated walls don't weight on buttons. That's on purpose ;-D. Changing that would break my level, so please, don't.\n* About connections between levels: I think pancelor's remark about the possibility to use wires to create connections has been greatly overlooked. This can be a great way to create connections. However, I would discourage you to place wires that exit the level, as anyone can think about reusing a button in a level to make a connection. What is important is to specify what states a button can be at the end of the level, especially if there is a harder solution with a different button state. And what is equally important is remarks like \"The level could have an interesting twist if there was a Door_Base at that position instead of the ground, or if there was a Door_Extended at that position instead of a platform\". Of course, inflatable walls provide even more connection possibilities. However, notice that pushing a button in one level could activate an inflatable wall in another level, which would push a BeltX, and thus have a permanent effect even if the button does not remain pushed at the end of the level it is in. We may want to avoid that, especially if the effect happens before the player had a chance to visit the level in which the effect happens.\n\nJumble - I thought this game didn't have multipush and was stuck at the first level for like 2 minutes >.>\n\nAuroriax - A thing I noticed I didn't have time to fix, is that it is not possible to see when two things are stacked on top of each other. I think there should be some kind of highlight or other visual effect in those cases. Other than that, this is pretty promising so far! [Though a little tricky to design levels for, I explored four level ideas before I got something I was satisfied with >_< ] )\n\n\n\n(IDEAS / COMMENTS) (GROUP B)\n(Joseph Mansfield (sftrabbit) - some thoughts I've had:\n- There's totally room for a little intro section of very basic stuff leading into my seed level. In particular, could introduce the ladders and belt multi-pushing behaviour with only BeltXs.\n- I feel like mechanics that make interesting conveyor contraptions would be interesting.\n- Can an infinite loop somehow be made into a useful thing? (I guess only if it can get interrupted by something)\n\nThatScar: I think the belts are too dark and the ground is too light. A belt should match the luminance of the surface it provides, not the surface it sits on top of. Remove this comment if fixed.\nPatrick: agreed\n\nJoel: I wonder if walls should behave like height 2 destroyable objects, so they can be exploded by bombs that are on platforms. This could allow for interesting alternate connections between levels, or it might be too unwieldy.\nAlso, it would be cool if there was some hub area where if you gathered enough bombs from its branches, you could explode your way to the centre of the hub where secret treasure awaits.\nV\nPichu: \"Don't add mechanics that break the wall boundaries of levels\" is one of our rules, joseph is fairly against that\nV\nNotan: I guess it would be ok if there were destructible walls in addition to normal walls. But belts and platforms are already kinda destructible walls so I doubt we need another one of those types.\n\nPichu: I think explosives should blow up ladders they are next to but I cant read others' code well enough to do it so hopefully someone else does.\nV\nNotan: In my opiniton the ladders should be treated like they are in the cells of the objects they are attatched to, rather than the cells of those ladders. But the current visualization suggests otherwise so ¯\\_(ツ)_/¯\n\nNotan: I think if you can optionally bring out objects from a level, the game should explicitly say so. I don't know how ENIGMASH handled this, but it would be annoying for a player to be stuck on a level not realizing they didn't bring an object from 3 levels before.\nPatrick: agreed\nJoseph Mansfield (sftrabbit): I'll make sure this isn't a problem by constraining how blocks can be used when brought out of levels. If bringing a block out of the level is an intended part of the main solution, then that block will be required immediately. If bringing a block out is optional, it will be used only to get a secret. I have plans for how secrets will work.\n\nColin: I wanted to have a conveyor push a block with a ladder attached, but this would require conveyors in the floor or ladders above \n\n\nToombler: The level with solution starting \"push M left, push x up then left once\" seemed easier than winterbeak's level (at least after already solving winterbeak's level) while exploring similar ideas, so their ordering could maybe be considered - possibly both levels could be accessible at the same time, and they could be beaten in either order.\n\nTwak: I tried making a puzzle involving standing in specific spots to set off specific bombs, but couldn't find a way to prevent the player from just blowing up the area under the goal without using a lot of space. Decided to make a different level.\n\n\n(IDEAS / COMMENTS) (GROUP MERGE)\n\ndomcamus: Haven't thought very much about interconnections; level is mostly standalone. Seems like there's a lot of scope for doing stuff with stickiness, which I didn't explore at all because sticky goo requires a lot of bombs and bombs mess up puzzles! :-D\n\nstevenjmiller: The level design on display here is phenomenal. I really hope ladder fusion makes it into the game. As an example, you might want to create a diagonal, but in doing so, the resulting belt gets a ladder that makes it difficult to maneuver around the level. I also noticed that fusion involving BeltX's hasn't been explored very heavily, presumably because it doesn't normally have an impact on the resulting belt. Ladder and sticky fusion change that, and I think it opens up some interesting possibilities.\n\nD5R: Looks like I'm the last person in the chain before all the levels are patched together! As such, I wanted to make a level that combines everything while keeping it compact as a possible candidate for a final level. I also added a variation on my level which has two exits: the intended original exit and a \"bonus\" exit only accessible if you manage to smuggle a block in. An example of how this can be used would be to have some of the very large puzzles to be optional 'challenge' puzzles and solving all the challenge puzzles give the player access to an extra belt for the level to get to the secret ending. Of course, this is just a suggestion and you're free to place this level where you think it fits best. Good luck and have fun stitching all these puzzles together!)\n\n\n\n========\nOBJECTS\n========\n\nBackground1\n#b5b5b5 #b8b8b7\n00000\n00010\n01000\n00001\n00000\n\nBackground2\n#a6a0a2\n\nPlatform1\n#e9e9e9 #e6e7e6 #cfcfcf\n00010\n10000\n00100\n00000\n01000\n\nPlatform1_Front\n#cfcfcf\n.....\n.....\n00000\n00000\n00000\n\nPlatform1_Top\n#e9e9e9 #e6e7e6 #cfcfcf\n.....\n.....\n00100\n00000\n01000\n\nPlatform2\n#E2D9DC #F2E6EA\n00100\n00000\n00000\n00100\n01110\n\nPlatform2_Front\n#c3bbbd\n.....\n.....\n00000\n00000\n00000\n\nPlatform2_Top\n#E2D9DC #F2E6EA\n.....\n.....\n00000\n00100\n01110\n\nPlatformMark1_Below\n#adadad #b1b1b0\n00000\n00010\n01000\n00001\n00000\n\nPlatformMark2_Below\n#9e999a\n\nBeltMark1_Below\n#adadad #b1b1b0\n00000\n0...0\n0...0\n0...1\n00000\n\nBeltMark1_Above\n#dedede #dbdcdb #c5c5c5\n0...0\n10000\n.....\n.....\n.....\n\nBeltMark1_Above_Top\n#dedede #dbdcdb #c5c5c5\n.....\n.....\n00100\n0...0\n0...0\n\nBeltMark2_Above\n#D9D2D5 #E9DEE3\n0...0\n00000\n.....\n.....\n.....\n\nBeltMark2_Above_Top\n#D9D2D5 #E9DEE3\n.....\n.....\n00000\n0...0\n0...0\n\nBeltMark2_Below\n#9e999a\n00000\n0...0\
